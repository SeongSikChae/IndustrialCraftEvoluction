name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            Material/build/libs/*.jar
            Machine/build/libs/*.jar
            !**/*-sources.jar
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect mod_version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$current" ]]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi

          previous=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            previous="$(git show HEAD^:gradle.properties 2>/dev/null | grep -E '^mod_version=' | cut -d= -f2- | tr -d '[:space:]' || true)"
          fi

          echo "previous=${previous:-<none>}"
          echo "current=${current}"

          if [[ "$previous" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No mod_version change; skipping release."
            exit 0
          fi

          tag="v${current}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already exists on origin; skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prerelease=false
          lower="$(echo "$current" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lower" =~ (alpha|beta|rc|snapshot) ]]; then
            prerelease=true
          elif [[ "$current" =~ ^0\. ]]; then
            prerelease=true
          fi

          {
            echo "changed=true"
            echo "version=${current}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Download mod jars
        if: steps.version.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mods
          path: release-jars

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
